<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senior Full Stack Developer Portfolio</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
    />
  </head>
  <body>
    <div class="background">
      <div class="cloud-layer cloud-layer-1"></div>
      <div class="cloud-layer cloud-layer-2"></div>
      <div class="code-overlay">
        <pre><code class="language-typescript" id="highlighted-code"></code></pre>
      </div>
    </div>

    <main>
      <!-- Profile Section -->
      <section class="profile-section">
        <div class="card profile-card">
          <div class="profile-content">
            <div class="profile-image">
              <img
                src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4"
                alt="Profile"
              />
            </div>
            <div class="profile-info">
              <h1>Horst Sill</h1>
              <h2>Senior Full Stack Developer</h2>
              <p>
                Softwareentwickler aus Leidenschaft. Mit über 20 Jahren
                Erfahrung in der Full Stack Entwicklung.
              </p>
              <div class="social-links">
                <a
                  href="https://github.com/DerSilly"
                  class="icon-button"
                  aria-label="GitHub"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
                    />
                    <path d="M9 18c-4.51 2-5-2-7-2" />
                  </svg>
                </a>
                <a
                  href="https://www.xing.com/profile/Horst_Sill"
                  class="icon-button"
                  aria-label="Xing"
                >
                    <svg
                    xmlns="http://www.w3.org/2000/svg"
                    xmlns:xlink="http://www.w3.org/1999/xlink"
                    width="24"
                    height="24"
                    viewBox="0 0 512 512"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    >
                    <path
                      d="M418.592,12.383C416.788,9.355,413.524,7.5,410,7.5h-95c-3.58,0-6.888,1.914-8.671,5.019l-135,235
                         c-1.806,3.143-1.77,7.018,0.096,10.126l90,150c1.808,3.012,5.063,4.855,8.575,4.855h100c3.63,0,6.975-1.967,8.739-5.139
                         c1.764-3.172,1.671-7.051-0.243-10.135l-86.938-140.068L418.793,22.263C420.472,19.164,420.395,15.411,418.592,12.383z
                         M271.207,252.737c-1.71,3.156-1.597,6.986,0.297,10.036l80.52,129.727h-76.361l-84.066-140.11L320.788,27.5h72.423
                         L271.207,252.737z"
                    />
                    <path
                      d="M178.85,172.843l-50-95c-1.729-3.286-5.137-5.343-8.85-5.343H30c-3.428,0-6.617,1.756-8.45,4.652
                         c-1.833,2.897-2.055,6.531-0.587,9.628l42.779,90.313L1.294,287.58c-1.749,3.096-1.724,6.888,0.068,9.96
                         c1.793,3.072,5.081,4.96,8.638,4.96h95c3.605,0,6.932-1.941,8.706-5.08l65-115C180.379,179.46,180.433,175.852,178.85,172.843z
                         M99.165,282.5H27.139l56.567-100.08c1.6-2.831,1.724-6.263,0.331-9.201L45.802,92.5h68.161l44.646,84.829L99.165,282.5z"
                    />
                    </svg>
                </a>
                <a
                  href="mailto:horst.sill@gmx.de"
                  class="icon-button"
                  aria-label="Email"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect width="20" height="16" x="2" y="4" rx="2" />
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                  </svg>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Skills Section -->
      <section class="skills-section">
        <div class="card">
          <h2>Skills & Expertise</h2>
          <div class="skills-grid">
            <div class="skill-item">
              <div class="skill-header">
                <svg viewBox="0 0 24 24" fill="currentColor" class="skill-icon">
                  <path
                    d="M12 13.5V18m0-4.5a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v4.5m-6-4.5a1.5 1.5 0 0 0-1.5-1.5h-3a1.5 1.5 0 0 0-1.5 1.5v4.5m6-4.5V18m-6-4.5V18m12-10.5v.75m0 3.75v.75m0 3.75v.75M6 7.5v.75m0 3.75v.75m0 3.75v.75M6 7.5h12M6 12h12m-12 4.5h12"
                  ></path>
                </svg>
                <span>React</span>
              </div>
              <div class="progress-bar">
                <div class="progress" style="width: 95%"></div>
              </div>
            </div>
            <!-- More skills will be dynamically added by JavaScript -->
          </div>
        </div>
      </section>

      <!-- Contact Section -->
      <section class="contact-section">
        <div class="card">
          <h2>Kontakt</h2>
          <div class="contact-grid">
            <div class="contact-info">
              <div class="contact-item">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect width="20" height="16" x="2" y="4" rx="2" />
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                </svg>
                <span>horst.sill@gmx.de</span>
              </div>
              <div class="contact-item">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                  />
                </svg>
                <span>+49 8053 207029</span>
              </div>
              <div class="contact-item">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                  <circle cx="12" cy="10" r="3" />
                </svg>
                <span>Bad Endorf</span>
              </div>
            </div>
            <form class="contact-form">
              <input type="text" placeholder="Ihr Name" required />
              <input type="email" placeholder="Your Email" required />
              <textarea placeholder="Ihre Nachricht" required></textarea>
              <button type="submit" class="primary-button">
                Nachricht senden
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
